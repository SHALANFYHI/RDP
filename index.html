<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple ID Portfolio</title>
    <style>
        body {
            background-color: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            color: #ff3b30;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .field-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .label {
            font-size: 12px;
            color: #8e8e93;
            margin-bottom: 5px;
            display: block;
        }
        .input-wrapper {
            display: flex;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }
        .copy-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        input {
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            flex: 1;
            font-family: monospace;
            font-size: 14px;
            outline: none;
        }
        .edit-badge {
            background: #f5f5f5;
            color: #333;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            float: left;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="edit-badge">تعديل ✎</div>
    <div class="logo">🍎 Apple ID</div>

    <div class="field-group">
        <span class="label">بريد إلكتروني / Email</span>
        <div class="input-wrapper">
            <button class="copy-btn" onclick="copyText('email')">📋</button>
            <input type="text" id="email" value="stefanoalfarouqmy4@icloud.com">
        </div>
    </div>

    <div class="field-group">
        <span class="label">كلمة المرور / Password</span>
        <div class="input-wrapper">
            <button class="copy-btn" onclick="copyText('pass')">📋</button>
            <input type="text" id="pass" value="@L@?z44I#qvZc">
        </div>
    </div>

    <div class="field-group">
        <span class="label">الاسم الأول / First Name</span>
        <div class="input-wrapper">
            <button class="copy-btn" onclick="copyText('fname')">📋</button>
            <input type="text" id="fname" value="Stefano">
        </div>
    </div>

    <div class="field-group">
        <span class="label">اسم العائلة / Last Name</span>
        <div class="input-wrapper">
            <button class="copy-btn" onclick="copyText('lname')">📋</button>
            <input type="text" id="lname" value="Al-Farouq">
        </div>
    </div>
</div>

<script>
    function copyText(id) {
        var copyText = document.getElementById(id);
        copyText.select();
        document.execCommand("copy");
        alert("تم النسخ: " + copyText.value);
    }
</script>

</body>
</html>
